<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8C2F16">
<title>FARDA · Desperdicios</title>
<style>
:root{
  --brasa:#8C2F16; --tinta:#1A1A1A; --gris:#6B6560;
  --fondo:#FAF8F6; --carta:#FFFFFF; --linea:#E4E0DA; --suave:#F2F0ED;
  --ok:#2F6B3A; --alerta:#9C6500; --mal:#9C0006;
  --r:14px; --sombra:0 1px 3px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --brasa:#E2724F; --tinta:#F2EFEC; --gris:#A39C95;
    --fondo:#151311; --carta:#1F1C1A; --linea:#332F2B; --suave:#262321;
    --ok:#7FBF8C; --alerta:#E0B25C; --mal:#F09A92;
    --sombra:0 1px 3px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --brasa:#E2724F; --tinta:#F2EFEC; --gris:#A39C95;
  --fondo:#151311; --carta:#1F1C1A; --linea:#332F2B; --suave:#262321;
  --ok:#7FBF8C; --alerta:#E0B25C; --mal:#F09A92;
  --sombra:0 1px 3px rgba(0,0,0,.4);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--fondo); color:var(--tinta);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  font-size:16px; line-height:1.45;
  padding-bottom:env(safe-area-inset-bottom);
}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
.oculto{display:none !important}

/* --- cabecera --- */
header{
  position:sticky;top:0;z-index:20;background:var(--fondo);
  border-bottom:1px solid var(--linea);
  padding:calc(env(safe-area-inset-top) + 10px) 0 10px;
}
.hd{display:flex;align-items:center;gap:10px}
.marca{font-weight:800;letter-spacing:.14em;color:var(--brasa);font-size:15px}
.hd .quien{margin-left:auto;font-size:13px;color:var(--gris);text-align:right;line-height:1.2}
.hd .quien b{display:block;color:var(--tinta);font-size:14px}
.salir{background:none;border:none;color:var(--gris);font-size:12px;text-decoration:underline;padding:4px 0;cursor:pointer}

/* --- pestañas --- */
nav{display:flex;gap:6px;padding:10px 0 0}
nav button{
  flex:1;padding:11px 8px;border:1px solid var(--linea);background:var(--carta);
  color:var(--gris);border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;
  font-family:inherit;
}
nav button[aria-selected="true"]{background:var(--brasa);color:#fff;border-color:var(--brasa)}

main{padding:16px 0 90px}
.card{background:var(--carta);border:1px solid var(--linea);border-radius:var(--r);
  padding:14px;margin-bottom:12px;box-shadow:var(--sombra)}
label{display:block;font-size:13px;font-weight:700;color:var(--gris);margin:0 0 6px}
input,select,textarea,button{font-family:inherit;font-size:16px}
input[type=text],input[type=number],input[type=search],textarea,select{
  width:100%;padding:13px 12px;border:1px solid var(--linea);border-radius:11px;
  background:var(--fondo);color:var(--tinta);
}
input:focus,textarea:focus,select:focus{outline:2px solid var(--brasa);outline-offset:1px}
textarea{min-height:64px;resize:vertical}

/* --- chips --- */
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{
  padding:10px 13px;border:1px solid var(--linea);border-radius:999px;background:var(--fondo);
  color:var(--tinta);font-size:14px;cursor:pointer;min-height:44px;display:flex;align-items:center;
}
.chip[aria-pressed="true"]{background:var(--brasa);color:#fff;border-color:var(--brasa);font-weight:600}

/* --- buscador de insumo --- */
.lista{max-height:230px;overflow:auto;border:1px solid var(--linea);border-radius:11px;margin-top:8px}
.lista button{
  display:block;width:100%;text-align:left;padding:12px;background:var(--carta);border:none;
  border-bottom:1px solid var(--linea);color:var(--tinta);cursor:pointer;font-size:15px;
}
.lista button:last-child{border-bottom:none}
.lista .sub{display:block;font-size:12px;color:var(--gris);margin-top:2px}
.elegido{display:flex;align-items:center;gap:10px;padding:12px;background:var(--suave);
  border-radius:11px;border:1px solid var(--linea)}
.elegido .nom{font-weight:700;flex:1}
.elegido .x{background:none;border:none;color:var(--gris);font-size:22px;cursor:pointer;padding:0 6px}

/* --- cantidad --- */
.cant{display:flex;gap:8px;align-items:stretch}
.cant input{flex:1;font-size:26px;font-weight:700;text-align:center;padding:14px 8px}
.cant .um{display:flex;align-items:center;padding:0 16px;background:var(--suave);
  border:1px solid var(--linea);border-radius:11px;font-weight:700;color:var(--gris)}
.rapidos{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.rapidos button{flex:1;min-width:58px;padding:9px 4px;border:1px solid var(--linea);
  background:var(--fondo);color:var(--tinta);border-radius:9px;font-size:14px;cursor:pointer}

/* --- plata --- */
.plata{display:flex;align-items:baseline;justify-content:space-between;
  padding:14px;background:var(--suave);border-radius:11px;border:1px solid var(--linea)}
.plata span{font-size:13px;color:var(--gris);font-weight:700}
.plata b{font-size:26px;color:var(--brasa)}

/* --- botones --- */
.primario{
  width:100%;padding:17px;background:var(--brasa);color:#fff;border:none;border-radius:13px;
  font-size:17px;font-weight:700;cursor:pointer;
}
.primario:disabled{opacity:.4}
.secundario{width:100%;padding:13px;background:var(--carta);color:var(--tinta);
  border:1px solid var(--linea);border-radius:11px;font-size:15px;cursor:pointer}

/* --- foto --- */
.foto{display:flex;gap:10px;align-items:center}
.foto label.btn{flex:1;margin:0;padding:13px;border:1px dashed var(--linea);border-radius:11px;
  text-align:center;color:var(--gris);font-weight:600;cursor:pointer;font-size:14px}
.foto img{width:64px;height:64px;object-fit:cover;border-radius:10px;border:1px solid var(--linea)}

/* --- teclado PIN --- */
.pinbox{max-width:320px;margin:8vh auto 0;text-align:center}
.pinbox h1{font-size:20px;margin:0 0 4px}
.pinbox p{color:var(--gris);font-size:14px;margin:0 0 22px}
.puntos{display:flex;gap:12px;justify-content:center;margin-bottom:26px}
.puntos i{width:14px;height:14px;border-radius:50%;border:2px solid var(--linea);display:block}
.puntos i.on{background:var(--brasa);border-color:var(--brasa)}
.teclas{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.teclas button{padding:19px 0;font-size:23px;font-weight:600;background:var(--carta);
  border:1px solid var(--linea);border-radius:13px;color:var(--tinta);cursor:pointer}
.teclas button.vacia{background:none;border:none}

/* --- listas de registros --- */
.reg{display:flex;gap:11px;padding:12px 0;border-bottom:1px solid var(--linea);align-items:flex-start}
.reg:last-child{border-bottom:none}
.reg .cuerpo{flex:1;min-width:0}
.reg .t{font-weight:700;font-size:15px}
.reg .m{font-size:13px;color:var(--gris);margin-top:2px}
.reg .p{font-weight:700;color:var(--brasa);white-space:nowrap;font-size:15px}
.reg.anulado{opacity:.45}
.reg.anulado .t{text-decoration:line-through}
.reg img{width:44px;height:44px;object-fit:cover;border-radius:8px;border:1px solid var(--linea)}

/* --- totales --- */
.tot{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tot div{background:var(--carta);border:1px solid var(--linea);border-radius:var(--r);padding:13px}
.tot span{display:block;font-size:12px;color:var(--gris);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.tot b{display:block;font-size:22px;margin-top:3px;color:var(--brasa)}
.barra{display:flex;align-items:center;gap:9px;padding:7px 0;font-size:14px}
.barra .n{flex:0 0 38%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barra .b{flex:1;height:9px;background:var(--suave);border-radius:5px;overflow:hidden}
.barra .b i{display:block;height:100%;background:var(--brasa);border-radius:5px}
.barra .v{flex:0 0 auto;font-variant-numeric:tabular-nums;color:var(--gris);font-size:13px}

h2{font-size:15px;margin:0 0 10px;color:var(--gris);text-transform:uppercase;letter-spacing:.05em}
.vacio{color:var(--gris);font-size:14px;text-align:center;padding:26px 0}

/* --- aviso --- */
#aviso{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:60;
  background:var(--tinta);color:var(--fondo);padding:13px 20px;border-radius:12px;
  font-size:15px;font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,.25);max-width:92vw;text-align:center}
#aviso.mal{background:var(--mal);color:#fff}
.cargando{color:var(--gris);font-size:14px;text-align:center;padding:26px 0}
</style>
</head>
<body>

<div id="pantallaPin">
  <div class="wrap pinbox">
    <div class="marca" style="margin-bottom:26px">F A R D A</div>
    <h1>Control de desperdicios</h1>
    <p>Ingresá tu PIN</p>
    <div class="puntos" id="puntos"><i></i><i></i><i></i><i></i></div>
    <div class="teclas" id="teclas"></div>
  </div>
</div>

<div id="pantallaApp" class="oculto">
  <header>
    <div class="wrap">
      <div class="hd">
        <div class="marca">F A R D A</div>
        <div class="quien"><b id="miNombre"></b><span id="miSector"></span>
          <button class="salir" id="btnSalir">salir</button></div>
      </div>
      <nav role="tablist">
        <button role="tab" id="tabCargar"  aria-selected="true">Cargar</button>
        <button role="tab" id="tabHoy"     aria-selected="false">Hoy</button>
        <button role="tab" id="tabResumen" aria-selected="false">Resumen</button>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <!-- CARGAR -->
    <section id="vistaCargar">
      <div class="card">
        <label for="buscar">Qué se tira</label>
        <div id="cajaBuscar">
          <input type="search" id="buscar" placeholder="Escribí el nombre…" autocomplete="off" enterkeyhint="search">
          <div class="lista oculto" id="resultados"></div>
        </div>
        <div class="elegido oculto" id="elegido">
          <div class="nom" id="elegidoNom"></div>
          <button class="x" id="elegidoX" aria-label="Cambiar">×</button>
        </div>
      </div>

      <div class="card">
        <label for="cantidad">Cuánto</label>
        <div class="cant">
          <input type="number" id="cantidad" inputmode="decimal" step="0.01" min="0" placeholder="0">
          <div class="um" id="unidad">—</div>
        </div>
        <div class="rapidos" id="rapidos"></div>
      </div>

      <div class="card">
        <div class="plata"><span>Plata que se tira</span><b id="plata">$0</b></div>
      </div>

      <div class="card">
        <label>Por qué</label>
        <div class="chips" id="motivos"></div>
      </div>

      <div class="card">
        <label>Quién lo tira</label>
        <div class="chips" id="sectores"></div>
      </div>

      <div class="card">
        <label>Foto (opcional)</label>
        <div class="foto">
          <label class="btn" for="foto" id="fotoTxt">Sacar o elegir foto</label>
          <input type="file" id="foto" accept="image/*" capture="environment" class="oculto">
          <img id="fotoPrev" class="oculto" alt="">
        </div>
      </div>

      <div class="card">
        <label for="nota">Nota (opcional)</label>
        <textarea id="nota" placeholder="Algo que sirva para entenderlo después"></textarea>
      </div>

      <button class="primario" id="btnGuardar" disabled>Registrar</button>
    </section>

    <!-- HOY -->
    <section id="vistaHoy" class="oculto">
      <div class="tot">
        <div><span>Hoy</span><b id="totHoy">$0</b></div>
        <div><span>Registros</span><b id="cantHoy">0</b></div>
      </div>
      <div class="card"><h2>Cargado hoy</h2><div id="listaHoy"><div class="cargando">Cargando…</div></div></div>
      <button class="secundario" id="btnRefrescar">Actualizar</button>
    </section>

    <!-- RESUMEN -->
    <section id="vistaResumen" class="oculto">
      <div class="tot">
        <div><span>Este mes</span><b id="totMes">$0</b></div>
        <div><span>Últimos 7 días</span><b id="totSem">$0</b></div>
      </div>
      <div class="card"><h2>Por motivo</h2><div id="porMotivo"></div></div>
      <div class="card"><h2>Por sector</h2><div id="porSector"></div></div>
      <div class="card"><h2>Los 10 que más cuestan</h2><div id="topInsumos"></div></div>
      <div class="card"><h2>Últimos registros</h2><div id="listaTodos"></div></div>
    </section>
  </main>
</div>

<div id="aviso" class="oculto"></div>

}

      else if(k && pin.length < 4) pin += k;
      pintarPin();
      if(pin.length === 4) entrar();
    };

  });
}
async function entrar(){

/* ---------- insumos: primero los de la planilla embebida, después los vivos ---------- */
async function cargarInsumosVivos(){
  try{
    const {data, error} = await sb.from("pricing_state").select("*").limit(1);
    if(error || !data || !data[0]) return;
    let obj = null;
    for(const v of Object.values(data[0])){
      if(v && typeof v === "object"){
        if(v.insumos && typeof v.insumos === "object") { obj = v.insumos; break; }
      }
    }
    if(!obj && data[0].insumos && typeof data[0].insumos === "object") obj = data[0].insumos;
    if(!obj) return;
    const previos = new Map(insumos.map(i => [i.n.toUpperCase(), i]));
    const vivos = Object.entries(obj).map(([nombre, v]) => {
      const p = previos.get(nombre.toUpperCase());
      return {
        n: p ? p.n : lindo(nombre),
        u: (v && v.unidad) || (p && p.u) || "KG",
        c: Number((v && v.costo) || (p && p.c) || 0),
        d: p ? p.d : ""
      };
    });
    if(vivos.length > 20){ insumos = vivos.sort((a,b)=>a.n.localeCompare(b.n,"es")); }
  }catch(e){ /* nos quedamos con la lista embebida */ }
}
const MENORES = new Set(["de","del","la","el","en","y","a","con","para","al","los","las"]);
function lindo(s){
  return s.toLowerCase().split(/\s+/).map((w,i)=>
    (i>0 && MENORES.has(w)) ? w : w.charAt(0).toUpperCase()+w.slice(1)).join(" ");
}

/* ---------- buscador ---------- */
function normal(s){ return s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase(); }
$("buscar").addEventListener("input", e=>{
  const q = normal(e.target.value.trim());
  const cont = $("resultados");
  if(q.length < 2){ cont.classList.add("oculto"); cont.innerHTML=""; return; }
  const hits = insumos
    .map(i => {
      const t = normal(i.n);
      let r = -1;
      if(t.startsWith(q)) r = 0;
      else if(new RegExp("(^|\\s)" + q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).test(t)) r = 1;
      else if(t.includes(q)) r = 2;
      return {i, r};
    })
    .filter(x => x.r >= 0)
    .sort((a,b) => a.r - b.r || a.i.n.localeCompare(b.i.n,"es"))
    .slice(0,30)
    .map(x => x.i);
  cont.innerHTML = "";
  if(!hits.length){
    cont.innerHTML = '<div class="vacio">Nada con ese nombre</div>';
  } else {
    hits.forEach(i=>{
      const b = document.createElement("button");
      b.innerHTML = '<span></span><span class="sub"></span>';
      b.children[0].textContent = i.n;
      b.children[1].textContent = plata(i.c) + " por " + i.u + (i.d ? " · " + i.d : "");
      b.onclick = ()=>elegir(i);
      cont.appendChild(b);
    });
  }
  cont.classList.remove("oculto");
});
function elegir(i){
  elegido = i;
  $("cajaBuscar").classList.add("oculto");
  $("elegido").classList.remove("oculto");
  $("elegidoNom").textContent = i.n;
  $("unidad").textContent = i.u;
  pintarRapidos();
  recalcular();
  $("cantidad").focus();
}
$("elegidoX").onclick = ()=>{
  elegido = null;
  $("cajaBuscar").classList.remove("oculto");
  $("elegido").classList.add("oculto");
  $("buscar").value = ""; $("resultados").classList.add("oculto");
  $("unidad").textContent = "—"; $("rapidos").innerHTML = "";
  recalcular();
};

/* ---------- cantidad ---------- */
function pintarRapidos(){
  const u = elegido ? elegido.u : "KG";
  const vals = u === "UNIDAD" ? [1,2,3,5,10] : [0.1,0.25,0.5,1,2];
  const cont = $("rapidos"); cont.innerHTML = "";
  vals.forEach(v=>{
    const b = document.createElement("button");
    b.textContent = "+" + String(v).replace(".", ",");
    b.onclick = ()=>{
      const act = parseFloat($("cantidad").value) || 0;
      $("cantidad").value = Math.round((act + v) * 1000) / 1000;
      recalcular();
    };
    cont.appendChild(b);
  });
}
$("cantidad").addEventListener("input", recalcular);
function recalcular(){
  const cant = parseFloat($("cantidad").value) || 0;
  $("plata").textContent = plata(elegido ? cant * elegido.c : 0);
  $("btnGuardar").disabled = !(elegido && cant > 0 && motivo && sector);
}

function pintarChips(){
  const m = $("motivos"); m.innerHTML = "";
  MOTIVOS.forEach(x=>{
    const b = document.createElement("button");
    b.className = "chip"; b.type = "button"; b.textContent = x;
    b.setAttribute("aria-pressed", String(motivo === x));
    b.onclick = ()=>{ motivo = x; pintarChips(); recalcular(); };
    m.appendChild(b);

  SECTORES.forEach(x=>{
    const b = document.createElement("button");
    b.className = "chip"; b.type = "button"; b.textContent = x;

    b.onclick = ()=>{ sector = x; pintarChips(); recalcular(); };
    s.appendChild(b);
  });

/* ---------- foto ---------- */
$("foto").addEventListener("change", e=>{
  const f = e.target.files && e.target.files[0];
  if(!f) return;
  fotoFile = f;
  $("fotoTxt").textContent = "Cambiar foto";
  const img = $("fotoPrev");
  img.src = URL.createObjectURL(f);
  img.classList.remove("oculto");
});
async function achicar(file){
  try{
    const bmp = await createImageBitmap(file);
    const max = 1280;
    const esc = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas");
    c.width = Math.round(bmp.width * esc); c.height = Math.round(bmp.height * esc);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, "image/jpeg", 0.75));
    return blob || file;
  }catch(e){ return file; }
}
async function subirFoto(){
  if(!fotoFile) return null;
  const chico = await achicar(fotoFile);
  const nombre = Date.now() + "-" + Math.random().toString(36).slice(2,8) + ".jpg";
  const {error} = await sb.storage.from("merma-fotos").upload(nombre, chico, {contentType:"image/jpeg"});
  if(error){ console.error(error); return null; }
  return sb.storage.from("merma-fotos").getPublicUrl(nombre).data.publicUrl;
}

/* ---------- guardar ---------- */
$("btnGuardar").onclick = async ()=>{
  const btn = $("btnGuardar");
  const cant = parseFloat($("cantidad").value) || 0;
  if(!(elegido && cant > 0 && motivo && sector)) return;
  btn.disabled = true; btn.textContent = "Guardando…";
  try{
    const url = await subirFoto();
    const {error} = await sb.rpc("merma_registrar", {
      p_pin: sesion.pin, p_insumo: elegido.n, p_unidad: elegido.u,
      p_cantidad: cant, p_costo: elegido.c, p_motivo: motivo,
      p_sector: sector, p_deposito: elegido.d || null,
      p_foto: url, p_nota: $("nota").value.trim() || null
    });
    if(error) throw error;
    aviso("Registrado · " + plata(cant * elegido.c));
    limpiar();
    traer();
  }catch(e){
    console.error(e); aviso("No se pudo guardar", true);
  }finally{
    btn.textContent = "Registrar"; recalcular();
  }
};
function limpiar(){
  $("elegidoX").click();
  $("cantidad").value = ""; $("nota").value = "";
  motivo = null; fotoFile = null;
  $("foto").value = ""; $("fotoPrev").classList.add("oculto");
  $("fotoTxt").textContent = "Sacar o elegir foto";
  pintarChips(); recalcular();
  window.scrollTo({top:0, behavior:"smooth"});
}

/* ---------- traer datos ---------- */
async function traer(){
  try{
    const {data, error} = await sb.rpc("merma_listar", {p_pin: sesion.pin});
    if(error) throw error;
    registros = data || [];

  }catch(e){
    console.error(e);
    $("listaHoy").innerHTML = '<div class="vacio">No se pudo traer la información</div>';
  }
}
const hoyStr = () => new Date().toLocaleDateString("en-CA", {timeZone:"America/Argentina/Buenos_Aires"});
const vivos  = () => registros.filter(r => !r.anulado);

function filaRegistro(r, conAnular){
  const d = document.createElement("div");
  d.className = "reg" + (r.anulado ? " anulado" : "");
  const hora = new Date(r.creado_en).toLocaleTimeString("es-AR",
    {hour:"2-digit", minute:"2-digit", timeZone:"America/Argentina/Buenos_Aires"});
  if(r.foto_url){
    const im = document.createElement("img"); im.src = r.foto_url; im.alt = ""; im.loading = "lazy";
    d.appendChild(im);
  }
  const c = document.createElement("div"); c.className = "cuerpo";
  const t = document.createElement("div"); t.className = "t";
  t.textContent = r.insumo + " · " + Number(r.cantidad).toLocaleString("es-AR") + " " + r.unidad;
  const m = document.createElement("div"); m.className = "m";
  m.textContent = r.motivo + " · " + r.sector + " · " + r.usuario + " · " + hora;
  c.appendChild(t); c.appendChild(m);
  if(r.nota){ const n = document.createElement("div"); n.className = "m"; n.textContent = r.nota; c.appendChild(n); }
  if(conAnular && !r.anulado){
    const a = document.createElement("button");
    a.className = "salir"; a.textContent = "anular";
    a.onclick = async ()=>{
      if(!confirm("¿Anular este registro?")) return;
      const {error} = await sb.rpc("merma_anular", {p_pin: sesion.pin, p_id: r.id});
      if(error){ aviso("No se pudo anular", true); return; }
      aviso("Anulado"); traer();
    };
    c.appendChild(a);
  }
  const p = document.createElement("div"); p.className = "p"; p.textContent = plata(r.costo_total);
  d.appendChild(c); d.appendChild(p);
  return d;
}

function pintarHoy(){
  const h = hoyStr();
  const mios = vivos().filter(r => r.fecha === h);
  $("totHoy").textContent  = plata(mios.reduce((a,r)=>a + Number(r.costo_total||0), 0));
  $("cantHoy").textContent = mios.length;
  const cont = $("listaHoy"); cont.innerHTML = "";
  const todosHoy = registros.filter(r => r.fecha === h);
  if(!todosHoy.length){ cont.innerHTML = '<div class="vacio">Todavía no se cargó nada hoy</div>'; return; }
  todosHoy.forEach(r => cont.appendChild(filaRegistro(r, sesion.admin)));
}

function barras(cont, pares){
  cont.innerHTML = "";
  if(!pares.length){ cont.innerHTML = '<div class="vacio">Sin datos</div>'; return; }
  const max = Math.max(...pares.map(p=>p[1])) || 1;
  pares.forEach(([nom, val])=>{
    const f = document.createElement("div"); f.className = "barra";
    const n = document.createElement("div"); n.className = "n"; n.textContent = nom; n.title = nom;
    const b = document.createElement("div"); b.className = "b";
    const i = document.createElement("i"); i.style.width = (val/max*100) + "%";
    b.appendChild(i);
    const v = document.createElement("div"); v.className = "v"; v.textContent = plata(val);
    f.appendChild(n); f.appendChild(b); f.appendChild(v);
    cont.appendChild(f);
  });
}
function agrupar(rows, campo){
  const m = new Map();
  rows.forEach(r => m.set(r[campo], (m.get(r[campo])||0) + Number(r.costo_total||0)));
  return [...m.entries()].sort((a,b)=>b[1]-a[1]);
}
function pintarResumen(){
  if(!sesion.admin) return;
  const hoy = new Date();
  const mes = hoyStr().slice(0,7);
  const hace7 = new Date(hoy.getTime() - 6*86400000).toLocaleDateString("en-CA",
    {timeZone:"America/Argentina/Buenos_Aires"});
  const delMes = vivos().filter(r => String(r.fecha).slice(0,7) === mes);
  const delaSem = vivos().filter(r => r.fecha >= hace7);
  $("totMes").textContent = plata(delMes.reduce((a,r)=>a+Number(r.costo_total||0),0));
  $("totSem").textContent = plata(delaSem.reduce((a,r)=>a+Number(r.costo_total||0),0));
  barras($("porMotivo"), agrupar(delMes, "motivo"));
  barras($("porSector"), agrupar(delMes, "sector"));
  barras($("topInsumos"), agrupar(delMes, "insumo").slice(0,10));
  const cont = $("listaTodos"); cont.innerHTML = "";
  if(!registros.length){ cont.innerHTML = '<div class="vacio">Sin registros</div>'; return; }
  registros.slice(0,40).forEach(r => cont.appendChild(filaRegistro(r, true)));
}

/* ---------- pestañas ---------- */
const vistas = {tabCargar:"vistaCargar", tabHoy:"vistaHoy", tabResumen:"vistaResumen"};
Object.keys(vistas).forEach(id=>{
  $(id).onclick = ()=>{
    Object.keys(vistas).forEach(o=>{
      $(o).setAttribute("aria-selected", String(o === id));
      $(vistas[o]).classList.toggle("oculto", o !== id);
    });
    if(id !== "tabCargar") traer();
  };
});
$("btnRefrescar").onclick = traer;

/* ---------- arranque ---------- */
armarTeclado(); pintarChips(); pintarRapidos();
if(falla){
  const caja = document.querySelector(".pinbox");
  const d = document.createElement("div");
  d.className = "card";
  d.style.marginTop = "22px"; d.style.textAlign = "left"; d.style.borderColor = "var(--mal)";
  d.innerHTML = '<b style="color:var(--mal)">No está configurado todavía</b>';
  const p2 = document.createElement("p");
  p2.style.margin = "8px 0 0"; p2.style.fontSize = "14px"; p2.textContent = falla;
  d.appendChild(p2);
  caja.appendChild(d);
  document.getElementById("teclas").querySelectorAll("button").forEach(b => b.disabled = true);
} else {
  let guardado = null;
  try{ guardado = localStorage.getItem("merma_pin"); }catch(e){}
  if(guardado && guardado.length === 4){ pin = guardado; pintarPin(); entrar(); }
}
</script>
